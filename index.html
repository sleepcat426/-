<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Merry Christmas, 林妍儀!</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Ma+Shan+Zheng&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. 迎賓封面 overlay -->
  <div id="welcome-overlay" class="welcome-overlay">
    <div class="welcome-card">
      <div class="welcome-icon">✉️</div>
      <h2>一封給 林妍儀 的聖誕心意</h2>
      <p>點擊下方按鈕開啟專屬於妳的驚喜</p>
      <button id="open-card-btn" class="open-btn">開啟聖誕卡片 ✨</button>
    </div>
  </div>

  <!-- 2. 背景飄雪 Canvas -->
  <canvas id="snow-canvas"></canvas>

  <!-- 3. 可愛踱步小企鵝 -->
  <img id="santa-sleigh" class="penguin-walk" src="penguin.webp" alt="送禮物的小企鵝">

  <!-- 4. 主要內容區塊 -->
  <main class="container">
    <div class="main-content">
      
      <!-- 左側：金色藝術標題 -->
      <header class="header">
        <div class="to-text">To: 林妍儀</div>
        <h1 class="title">Merry Christmas!</h1>
        <p class="subtitle">特別為妳準備的聖誕驚喜 ✨<br>點擊樹下的禮物盒拆開看看吧 🎁</p>
      </header>

      <!-- 右側：金藍螺旋光纖聖誕樹與樹下禮物 -->
      <div class="tree-wrapper" id="tree-container">
        <canvas id="tree-canvas" width="340" height="420"></canvas>
        
        <!-- 樹下三色禮物盒 -->
        <div class="presents" id="presents-group">
          <div class="present p1" data-gift="0" title="點擊拆開禮物 1">
            <div class="lid"></div>
            <div class="box"><div class="ribbon-v"></div><div class="ribbon-h"></div></div>
          </div>
          <div class="present p2" data-gift="1" title="點擊拆開禮物 2">
            <div class="lid"></div>
            <div class="box"><div class="ribbon-v"></div><div class="ribbon-h"></div></div>
          </div>
          <div class="present p3" data-gift="2" title="點擊拆開禮物 3">
            <div class="lid"></div>
            <div class="box"><div class="ribbon-v"></div><div class="ribbon-h"></div></div>
          </div>
        </div>
      </div>

    </div>

    <!-- 底部控制按鈕 -->
    <div class="controls">
      <button id="music-btn" class="btn">🎵 播放背景音樂</button>
      <button id="snow-toggle-btn" class="btn">❄️ 開/關飄雪</button>
    </div>
  </main>

  <!-- 5. 禮物告白彈窗 -->
  <div id="gift-modal" class="modal hidden">
    <div class="modal-content">
      <div class="gift-card">
        <div class="gift-icon" id="modal-gift-icon">🎁</div>
        <h2 class="gift-title" id="modal-gift-title">獲得禮物！</h2>
        <p class="gift-desc" id="modal-gift-desc">祝福語或禮物說明</p>
        <button id="close-modal-btn" class="btn btn-close">收下禮物 💖</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
